<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF 8">
        <meta name="viewport"content="width=device-width"initial-scale=1.0>
        <title>youtube.com clone</title>
        <link rel="stylesheet" href="youtube.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <body>
      <input class="search"type="text" placeholder="search">
       <div class="preview">
        <div><img class="thumbnail" src="thumbnail/thumbnail-1.webp"></div>
        <div>
          <div class="channel-picture">
            <img class="flow" src="thumbnail/channel-1.jpeg">
          </div>
          <div class="video-info">
            <p class="tech">Talking Tech and AI with Google CEO Sundar Pichai!</p>
            <p class="author">Marques Brownlee</p>
            <p class="view">3.4M views &#183; 6 months ago</p>
          </div>
          
          
        </div>
      </div>
      <div class="preview">
        
        <img  class="thumbnail" src="thumbnail/laugh.webp">
       
        <p class="try">Try Not To Laugh Challenge #9</p>
        <p class="author2">Markiplier</p>
        <p class="view2">19M views · 4 years ago</p>
      </div>
       
    </body>  
</html>
